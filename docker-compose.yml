x-laravel-environment: &laravel-environment
  APP_NAME: YouYaku
  APP_ENV: production
  APP_KEY: "${APP_KEY:?APP_KEY is required in Dokploy}"
  APP_DEBUG: "false"
  APP_URL: "${APP_URL:?APP_URL is required in Dokploy}"
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
  TZ: ${APP_TIMEZONE:-Asia/Jakarta}
  TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1,::1}"

  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  LOG_JSON_INCLUDE_STACKTRACES: "${LOG_JSON_INCLUDE_STACKTRACES:-false}"
  OBSERVABILITY_TRUST_INBOUND_IDS: "${OBSERVABILITY_TRUST_INBOUND_IDS:-false}"
  OBSERVABILITY_TELEMETRY_ENABLED: "${OBSERVABILITY_TELEMETRY_ENABLED:-false}"
  OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-youyaku-laravel}
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/json}
  OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
  OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-50}
  OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=production}"

  DB_CONNECTION: "${DB_CONNECTION:?DB_CONNECTION is required}"
  DB_HOST: "${DB_HOST:?DB_HOST is required}"
  DB_PORT: "${DB_PORT:?DB_PORT is required}"
  DB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
  DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
  DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"

  SESSION_DRIVER: redis
  SESSION_CONNECTION: sessions
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_EXPIRE_ON_CLOSE: "false"
  SESSION_ENCRYPT: "true"
  SESSION_HTTP_ONLY: "true"
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  SESSION_PATH: /
  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS is required in Dokploy}"

  CACHE_STORE: redis
  CACHE_LIMITER: rate_limits
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required in Dokploy}"
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_SESSION_DB: 2
  REDIS_QUEUE_DB: 3
  REDIS_RATE_LIMIT_DB: 4
  REDIS_HORIZON_DB: 5
  REDIS_REVERB_DB: 6
  REDIS_CACHE_CONNECTION: cache
  REDIS_CACHE_LOCK_CONNECTION: default
  REDIS_RATE_LIMIT_CONNECTION: rate_limits
  REDIS_QUEUE_CONNECTION: queue
  REDIS_QUEUE: default
  REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-120}
  REDIS_QUEUE_BLOCK_FOR: ${REDIS_QUEUE_BLOCK_FOR:-5}
  REDIS_QUEUE_AFTER_COMMIT: "true"
  HORIZON_REDIS_CONNECTION: horizon_meta
  HORIZON_PREFIX: "${HORIZON_PREFIX:-youyaku_horizon:}"
  HORIZON_WORKER_TIMEOUT: ${HORIZON_WORKER_TIMEOUT:-90}
  HORIZON_WORKER_TRIES: ${HORIZON_WORKER_TRIES:-3}
  HORIZON_MEMORY_LIMIT: ${HORIZON_MEMORY_LIMIT:-64}
  HORIZON_CRITICAL_MAX_PROCESSES: ${HORIZON_CRITICAL_MAX_PROCESSES:-3}
  HORIZON_BUSINESS_MAX_PROCESSES: ${HORIZON_BUSINESS_MAX_PROCESSES:-6}
  HORIZON_BACKGROUND_MAX_PROCESSES: ${HORIZON_BACKGROUND_MAX_PROCESSES:-2}

  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: "${REVERB_APP_ID:?REVERB_APP_ID is required in Dokploy}"
  REVERB_APP_KEY: "${REVERB_APP_KEY:?REVERB_APP_KEY is required in Dokploy}"
  REVERB_APP_SECRET: "${REVERB_APP_SECRET:?REVERB_APP_SECRET is required in Dokploy}"
  REVERB_HOST: "${REVERB_HOST:?REVERB_HOST is required in Dokploy}"
  REVERB_PORT: ${REVERB_PORT:-443}
  REVERB_SCHEME: ${REVERB_SCHEME:-https}
  REVERB_ALLOWED_ORIGINS: "${REVERB_ALLOWED_ORIGINS:?REVERB_ALLOWED_ORIGINS is required in Dokploy}"
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080
  REVERB_SCALING_ENABLED: "true"
  REVERB_BROADCAST_HOST: reverb
  REVERB_BROADCAST_PORT: 8080
  REVERB_BROADCAST_SCHEME: http

  FILESYSTEM_DISK: public
  MEDIA_PUBLIC_DISK: ${MEDIA_PUBLIC_DISK:-media_public}
  MEDIA_PRIVATE_DISK: ${MEDIA_PRIVATE_DISK:-media_private}
  MEDIA_LEGACY_PUBLIC_DISK: ${MEDIA_LEGACY_PUBLIC_DISK:-public}
  MEDIA_LEGACY_ARCHIVE_DISK: ${MEDIA_LEGACY_ARCHIVE_DISK:-media_private}
  MEDIA_LEGACY_ARCHIVE_PREFIX: ${MEDIA_LEGACY_ARCHIVE_PREFIX:-legacy-retirement}
  MEDIA_LEGACY_RETIREMENT_ENABLED: "${MEDIA_LEGACY_RETIREMENT_ENABLED:-false}"
  MEDIA_LEGACY_RETIREMENT_MIN_AGE_DAYS: ${MEDIA_LEGACY_RETIREMENT_MIN_AGE_DAYS:-30}
  CHAT_ATTACHMENTS_DISK: ${CHAT_ATTACHMENTS_DISK:-media_private}
  MEDIA_PRIVATE_URL_LIFETIME: ${MEDIA_PRIVATE_URL_LIFETIME:-10}
  MEDIA_PUBLIC_PREFIX: ${MEDIA_PUBLIC_PREFIX:-public}
  MEDIA_PRIVATE_PREFIX: ${MEDIA_PRIVATE_PREFIX:-private}
  PROVIDER_DOCUMENTS_DISK: ${PROVIDER_DOCUMENTS_DISK:-provider_documents}
  PROVIDER_DOCUMENT_URL_LIFETIME: ${PROVIDER_DOCUMENT_URL_LIFETIME:-5}
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_BUCKET: "${AWS_BUCKET:-}"
  AWS_URL: "${AWS_URL:-}"
  AWS_ENDPOINT: "${AWS_ENDPOINT:-}"
  AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT:-false}"

  PROVIDER_FRONTEND_URL: "${PROVIDER_FRONTEND_URL:?PROVIDER_FRONTEND_URL is required in Dokploy}"
  CUSTOMER_FRONTEND_URL: "${CUSTOMER_FRONTEND_URL:?CUSTOMER_FRONTEND_URL is required in Dokploy}"

  MAIL_MAILER: log

  MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
  MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
  MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
  ALLOW_CUSTOMER_MANUAL_PAYMENT_CONFIRMATION: "false"

x-laravel-runtime: &laravel-runtime
  image: "${LARAVEL_IMAGE:-youyaku-laravel:local}"
  restart: unless-stopped
  init: true
  environment: *laravel-environment
  volumes:
    - youyaku_storage:/var/www/html/storage
  networks:
    - youyaku_net
    - youyaku_data

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    init: true
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
      MYSQL_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      MYSQL_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in Dokploy}"
    volumes:
      - youyaku_mysql:/var/lib/mysql
    networks:
      - youyaku_data
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    profiles:
      - dev-tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - youyaku_net
      - youyaku_data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    init: true
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required in Dokploy}"
    command:
      - sh
      - -ec
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --save 60 1000
        --maxmemory-policy noeviction
        --requirepass "$$REDIS_PASSWORD"
    volumes:
      - youyaku_redis:/data
    networks:
      - youyaku_data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    <<: *laravel-runtime
    build:
      context: .
      dockerfile: backend/laravel-core/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "/usr/local/bin/laravel-entrypoint"]
    environment:
      <<: *laravel-environment
      LARAVEL_PROCESS: backend
      RUN_DATABASE_MIGRATIONS: "true"
      DEPLOY_BACKUP_BEFORE_MIGRATE: ${DEPLOY_BACKUP_BEFORE_MIGRATE:-true}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend-http:
    image: "${BACKEND_HTTP_IMAGE:-youyaku-backend-http:local}"
    build:
      context: .
      dockerfile: platform/gateway/backend-http/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8080"
    volumes:
      - youyaku_storage:/var/www/html/storage:ro
    networks:
      - youyaku_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  horizon:
    <<: *laravel-runtime
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "horizon", "--no-interaction"]
    user: "www-data:www-data"
    environment:
      <<: *laravel-environment
      LARAVEL_PROCESS: horizon
      RUN_DATABASE_MIGRATIONS: "false"
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status --no-interaction >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  scheduler:
    <<: *laravel-runtime
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    user: "www-data:www-data"
    environment:
      <<: *laravel-environment
      LARAVEL_PROCESS: scheduler
      RUN_DATABASE_MIGRATIONS: "false"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "php artisan schedule:list --no-ansi >/dev/null 2>&1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s

  reverb:
    <<: *laravel-runtime
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction"]
    user: "www-data:www-data"
    environment:
      <<: *laravel-environment
      LARAVEL_PROCESS: reverb
      RUN_DATABASE_MIGRATIONS: "false"
    ports:
      - "${REVERB_BIND_ADDRESS:-127.0.0.1}:${REVERB_HOST_PORT:-8080}:8080"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:stable-alpine3.24
    profiles: ["gateway"]
    restart: unless-stopped
    init: true
    depends_on:
      reverb:
        condition: service_healthy
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_HOST_PORT:-8088}:80"
    environment:
      NGINX_REVERB_PUBLIC_HOST: "${REVERB_HOST:?REVERB_HOST is required in Dokploy}"
      # Restrict the official image's envsubst pass to our one public-host
      # placeholder so native Nginx variables such as $host remain intact.
      NGINX_ENVSUBST_FILTER: "^NGINX_REVERB_PUBLIC_HOST$"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      - ./platform/gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./platform/gateway/nginx/sites:/etc/nginx/templates:ro
    tmpfs:
      - /etc/nginx/conf.d
    networks:
      - youyaku_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"Host: $${NGINX_REVERB_PUBLIC_HOST}\" -O /dev/null http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  provider:
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.next
      args:
        APP_PATH: apps/provider-landing
        BACKEND_PROXY_URL: http://backend-http:8080
        NEXT_PUBLIC_BACKEND_URL: "${APP_URL:?APP_URL is required in Dokploy}"
        NEXT_PUBLIC_API_BASE_URL: "${APP_URL:?APP_URL is required in Dokploy}/api"
        NEXT_PUBLIC_PROVIDER_LOGIN_PATH: /provider/signin
        NEXT_PUBLIC_PROVIDER_DASHBOARD_PATH: /provider/dashboard
        VITE_BACKEND_URL: "${APP_URL:?APP_URL is required in Dokploy}"
        VITE_API_BASE_URL: "${APP_URL:?APP_URL is required in Dokploy}/api"
        VITE_PROVIDER_LOGIN_PATH: /provider/signin
        VITE_PROVIDER_DASHBOARD_PATH: /provider/dashboard
    restart: unless-stopped
    init: true
    depends_on:
      backend-http:
        condition: service_healthy
    ports:
      - "${PROVIDER_HOST_PORT:-5173}:3000"
    environment:
      PORT: 3000
    networks:
      - youyaku_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  customer:
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.next
      args:
        APP_PATH: apps/customer-web
        BACKEND_PROXY_URL: http://backend-http:8080
        NEXT_PUBLIC_BACKEND_URL: "${APP_URL:?APP_URL is required in Dokploy}"
        NEXT_PUBLIC_API_BASE_URL: "${APP_URL:?APP_URL is required in Dokploy}/api"
        NEXT_PUBLIC_PROVIDER_FRONTEND_URL: "${PROVIDER_FRONTEND_URL:?PROVIDER_FRONTEND_URL is required in Dokploy}"
        NEXT_PUBLIC_CUSTOMER_APP_URL: "${CUSTOMER_FRONTEND_URL:?CUSTOMER_FRONTEND_URL is required in Dokploy}"
        NEXT_PUBLIC_ALLOW_MANUAL_PAYMENT_CONFIRMATION: "false"
        VITE_BACKEND_URL: "${APP_URL:?APP_URL is required in Dokploy}"
        VITE_API_BASE_URL: "${APP_URL:?APP_URL is required in Dokploy}/api"
    restart: unless-stopped
    init: true
    depends_on:
      backend-http:
        condition: service_healthy
    ports:
      - "${CUSTOMER_HOST_PORT:-5174}:5174"
    environment:
      PORT: 5174
    networks:
      - youyaku_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5174',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  # Named volumes are intentionally persistent. Dokploy redeploy/rebuild does
  # not remove them; never use a destructive "down -v" / volume-delete action
  # against this project unless a full data reset is explicitly intended.
  youyaku_mysql:
  youyaku_redis:
  youyaku_storage:

networks:
  youyaku_net:
    driver: bridge
  youyaku_data:
    driver: bridge
    internal: true
