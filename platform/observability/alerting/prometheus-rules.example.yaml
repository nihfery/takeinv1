# Template metric contract. Validate every metric in staging before enabling.
groups:
  - name: youyaku-api
    interval: 30s
    rules:
      - alert: YouYakuApiHigh5xxRate
        expr: |
          sum(rate(http_server_request_duration_seconds_count{service_name="youyaku-laravel",http_response_status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_request_duration_seconds_count{service_name="youyaku-laravel"}[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: page
          service: youyaku-api
        annotations:
          summary: YouYaku API 5xx rate exceeds 5%
          runbook: platform/observability/runbooks/high-api-errors.md

      - alert: YouYakuApiP95LatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="youyaku-laravel"}[10m]))
          ) > 1.5
        for: 15m
        labels:
          severity: ticket
          service: youyaku-api
        annotations:
          summary: YouYaku API p95 latency exceeds 1.5 seconds
          runbook: platform/observability/runbooks/high-api-errors.md

  - name: youyaku-queue
    interval: 30s
    rules:
      - alert: YouYakuCriticalQueueBacklog
        expr: max(youyaku_horizon_queue_depth{queue="critical"}) > 20
        for: 5m
        labels:
          severity: page
          service: youyaku-horizon
        annotations:
          summary: Critical queue backlog is not draining
          runbook: platform/observability/runbooks/queue-saturation.md

      - alert: YouYakuFailedJobsIncreasing
        expr: increase(youyaku_queue_failed_jobs_total[10m]) > 5
        for: 5m
        labels:
          severity: page
          service: youyaku-horizon
        annotations:
          summary: Queue failures are increasing
          runbook: platform/observability/runbooks/queue-saturation.md

  - name: youyaku-business-safety
    interval: 60s
    rules:
      - alert: YouYakuInvalidPaymentWebhooks
        expr: increase(youyaku_payment_webhook_invalid_total[10m]) > 3
        for: 1m
        labels:
          severity: page
          service: youyaku-payments
        annotations:
          summary: Invalid or replayed payment webhook volume increased
          runbook: platform/observability/runbooks/payment-webhook-integrity.md

      - alert: YouYakuBookingConflictSpike
        expr: |
          increase(youyaku_booking_conflict_total[15m])
          /
          clamp_min(increase(youyaku_booking_create_total[15m]), 1)
          > 0.20
        for: 10m
        labels:
          severity: ticket
          service: youyaku-booking
        annotations:
          summary: Booking conflict ratio exceeds 20%
          runbook: platform/observability/runbooks/high-api-errors.md
