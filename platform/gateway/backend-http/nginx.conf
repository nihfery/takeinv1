user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_forwarded_proto $backend_forwarded_proto {
        "http" http;
        "https" https;
        default $scheme;
    }

    # Deliberately omit $request, $request_uri, $args, $query_string, Referer,
    # cookies, and authorization. Signed URL tokens still reach FastCGI below,
    # but access logs contain only the normalized queryless path.
    log_format queryless_json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"request_id":"$request_id"}';

    access_log /dev/stdout queryless_json;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    server_tokens off;
    client_max_body_size 16m;

    upstream laravel_fpm {
        server backend:9000;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        # These locations must never become reachable even if a future image
        # accidentally copies more than Laravel's public directory.
        location ~* ^/(?:\.env(?:\.|$)|composer\.(?:json|lock)$|artisan$|vendor|bootstrap|config|database|resources|routes|tests)(?:/|$) {
            access_log off;
            return 404;
        }

        location ~ (^|/)\. {
            access_log off;
            log_not_found off;
            return 404;
        }

        # Only storage/app/public is linked here. Private media, provider
        # documents, deployment backups, framework state, and logs remain
        # outside the web root even though the parent volume is mounted.
        location ~* ^/storage/(?:private|deployment-backups|framework|logs)(?:/|$) {
            access_log off;
            return 404;
        }

        location /storage/ {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            try_files $uri $uri/ @laravel;
        }

        # Preserve the legacy /index.php entry while refusing execution of any
        # other PHP file that might later appear below public/.
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_HOST $host;
            fastcgi_param HTTP_X_FORWARDED_PROTO $backend_forwarded_proto;
            fastcgi_param HTTP_X_REQUEST_ID $request_id;
            fastcgi_param HTTP_X_CORRELATION_ID $request_id;
            fastcgi_pass laravel_fpm;
            fastcgi_keep_conn on;
            fastcgi_read_timeout 120s;
        }

        location @laravel {
            include /etc/nginx/fastcgi_params;
            # fastcgi_params forwards QUERY_STRING and REQUEST_URI to Laravel;
            # relative signed routes therefore validate without exposing their
            # query tokens in the queryless access log above.
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_HOST $host;
            fastcgi_param HTTP_X_FORWARDED_PROTO $backend_forwarded_proto;
            fastcgi_param HTTP_X_REQUEST_ID $request_id;
            fastcgi_param HTTP_X_CORRELATION_ID $request_id;
            fastcgi_pass laravel_fpm;
            fastcgi_keep_conn on;
            fastcgi_read_timeout 120s;
        }

        location ~ \.php(?:/|$) {
            access_log off;
            return 404;
        }
    }
}
