services:
  # Local-only host ports. Dokploy invokes docker-compose.yml explicitly, so
  # these bindings are not applied in production where Traefik reaches each
  # service through its internal Compose network.
  db:
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_HOST_PORT:-3306}:3306"
    networks:
      - youyaku_net
      - youyaku_data

  backend-http:
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8080"

  reverb:
    ports:
      - "${REVERB_BIND_ADDRESS:-127.0.0.1}:${REVERB_HOST_PORT:-8080}:8080"

  provider:
    ports:
      - "${PROVIDER_HOST_PORT:-5173}:3000"

  customer:
    ports:
      - "${CUSTOMER_HOST_PORT:-5174}:5174"
