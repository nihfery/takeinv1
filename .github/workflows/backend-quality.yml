name: Backend Quality

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/laravel-core/**"
      - "tools/ci/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    defaults:
      run:
        working-directory: backend/laravel-core
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, mbstring, pcntl, pdo_mysql, redis, xml, zip
          coverage: none
          tools: composer:v2

      - name: Set up Go for workflow linting
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Generate an ephemeral application key
        run: php -r 'printf("APP_KEY=base64:%s\n", base64_encode(random_bytes(32)));' >> "$GITHUB_ENV"

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php83-composer-${{ hashFiles('backend/laravel-core/composer.lock') }}
          restore-keys: ${{ runner.os }}-php83-composer-

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install backend dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP syntax
        run: php ../../tools/ci/php-lint.php

      - name: Enforce Pint style ratchet
        run: php ../../tools/ci/check-pint-baseline.php

      - name: Validate GitHub workflow structure
        run: php ../../tools/ci/validate-workflows.php

      - name: Lint GitHub Actions semantics
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 ../../.github/workflows/*.yml

      - name: Prove Laravel boots
        run: |
          php artisan about --only=environment
          php artisan route:list --no-ansi > /dev/null
