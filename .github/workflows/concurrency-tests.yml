name: Concurrency Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/laravel-core/app/Modules/Booking/**"
      - "backend/laravel-core/app/Modules/Payment/**"
      - "backend/laravel-core/app/Modules/Promotion/**"
      - "backend/laravel-core/database/**"
      - "backend/laravel-core/tests/Concurrency/**"
      - "tools/ci/run-concurrency-tests.sh"
      - ".github/workflows/concurrency-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concurrency-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-process-contention:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: salonku_testing_fresh
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: salonku_testing_fresh
      DB_USERNAME: root
      DB_PASSWORD: ""
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: "false"
      OBSERVABILITY_TELEMETRY_ENABLED: "false"
      ALLOW_CUSTOMER_MANUAL_PAYMENT_CONFIRMATION: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, mbstring, pcntl, pdo_mysql, redis, xml, zip
          coverage: none
          tools: composer:v2

      - name: Generate an ephemeral application key
        run: php -r 'printf("APP_KEY=base64:%s\n", base64_encode(random_bytes(32)));' >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: backend/laravel-core
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run independent-process MySQL concurrency scenarios
        run: bash tools/ci/run-concurrency-tests.sh
