name: Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "contracts/**"
      - "tests/contract/**"
      - "backend/laravel-core/app/**"
      - "backend/laravel-core/bootstrap/**"
      - "backend/laravel-core/config/**"
      - "backend/laravel-core/composer.json"
      - "backend/laravel-core/composer.lock"
      - "backend/laravel-core/routes/**"
      - ".github/workflows/contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-route-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: salonku_contract_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: salonku_contract_testing
      DB_USERNAME: root
      DB_PASSWORD: ""
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, mbstring, pdo_mysql, redis, xml, zip
          coverage: none
          tools: composer:v2

      - name: Generate an ephemeral application key
        run: php -r 'printf("APP_KEY=base64:%s\n", base64_encode(random_bytes(32)));' >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: backend/laravel-core
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare the contract database
        working-directory: backend/laravel-core
        run: php artisan migrate --force --no-interaction

      - name: Validate seven OpenAPI documents against Laravel routes
        run: php tests/contract/validate-openapi.php
