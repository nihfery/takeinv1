name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/laravel-core/**"
      - ".github/workflows/backend-tests.yml"
      - "tools/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: salonku_testing_fresh
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: salonku_testing_fresh
      DB_USERNAME: root
      DB_PASSWORD: ""
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: "false"
      OBSERVABILITY_TELEMETRY_ENABLED: "false"
      ALLOW_CUSTOMER_MANUAL_PAYMENT_CONFIRMATION: "true"
    defaults:
      run:
        working-directory: backend/laravel-core
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, mbstring, pcntl, pdo_mysql, redis, xml, zip
          coverage: none
          tools: composer:v2

      - name: Generate an ephemeral application key
        run: php -r 'printf("APP_KEY=base64:%s\n", base64_encode(random_bytes(32)));' >> "$GITHUB_ENV"

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php83-composer-${{ hashFiles('backend/laravel-core/composer.lock') }}
          restore-keys: ${{ runner.os }}-php83-composer-

      - name: Install backend dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Apply test migrations
        run: |
          php artisan migrate --force --no-interaction
          php artisan migrate:status --pending --no-ansi

      - name: Run Laravel test suite
        run: |
          mkdir -p build
          php artisan test --log-junit build/phpunit.xml

      - name: Upload PHPUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-phpunit-${{ github.run_id }}
          path: backend/laravel-core/build/phpunit.xml
          if-no-files-found: warn
          retention-days: 14
